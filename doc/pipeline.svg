<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 722" width="440" height="722"
     role="img" aria-label="SheetMan 파이프라인: 엑셀과 구글 스프레드시트에서 임포트하고, 검증한 뒤, 내보내기와 코드 생성">
  <title>SheetMan 파이프라인</title>
  <desc>엑셀 또는 구글 스프레드시트 → 임포트 → 검증 → 내보내기와 코드 생성</desc>

  <style>
    /*
      Laid out top to bottom rather than left to right, because of where this is read.
      A wide diagram is scaled down to the width of the column it sits in, and GitHub's
      column on a phone is around 350px - so the 1030px version this replaces arrived at
      a third of its size and its 14px labels rendered at about five. Nothing about the
      content needed to be horizontal; only the shape did.

      Colours read on a white page, with a dark override. GitHub serves this as an image,
      so the query follows the viewer's system theme rather than the site's toggle - which
      is the closest a single file gets, and better than a diagram that vanishes on one.
    */
    .card   { fill: #ffffff; stroke: #c9d1d9; }
    .accent { fill: #f6f8fa; stroke: #c9d1d9; }
    .group  { fill: none; stroke: #d0d7de; }
    .title  { fill: #1f2328; font-weight: 600; }
    .label  { fill: #656d76; font-weight: 600; letter-spacing: .04em; }
    .detail { fill: #656d76; }
    .flow   { stroke: #8c959f; fill: none; }
    .arrow  { fill: #8c959f; }
    .rule   { stroke: #d0d7de; }

    @media (prefers-color-scheme: dark) {
      .card   { fill: #161b22; stroke: #30363d; }
      .accent { fill: #21262d; stroke: #30363d; }
      .group  { stroke: #30363d; }
      .title  { fill: #e6edf3; }
      .label  { fill: #9198a1; }
      .detail { fill: #9198a1; }
      .flow   { stroke: #6e7681; }
      .arrow  { fill: #6e7681; }
      .rule   { stroke: #30363d; }
    }

    text {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto,
                   "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    }
    .t16 { font-size: 16px; }
    .t13 { font-size: 13px; }
    .t12 { font-size: 12px; }
    .t11 { font-size: 11px; }
  </style>

  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow"/>
    </marker>
  </defs>

  <!-- 1. Sources -->
  <rect x="16" y="12" width="408" height="106" rx="8" class="accent" stroke-width="1.5"/>

  <!-- A spreadsheet glyph, drawn rather than an icon: no logos to keep current. -->
  <g transform="translate(38 40)">
    <rect x="0" y="0" width="44" height="54" rx="4" class="card" stroke-width="1.5"/>
    <line x1="0" y1="14" x2="44" y2="14" class="rule" stroke-width="1"/>
    <line x1="0" y1="28" x2="44" y2="28" class="rule" stroke-width="1"/>
    <line x1="0" y1="41" x2="44" y2="41" class="rule" stroke-width="1"/>
    <line x1="16" y1="14" x2="16" y2="54" class="rule" stroke-width="1"/>
    <line x1="30" y1="14" x2="30" y2="54" class="rule" stroke-width="1"/>
  </g>

  <text x="102" y="48" class="t16 title">데이터 원본</text>
  <text x="102" y="74" class="t13 detail">엑셀 · 구글 스프레드시트</text>
  <text x="102" y="96" class="t12 detail">테이블 · enum · 상수를 마커로 선언</text>

  <line x1="220" y1="118" x2="220" y2="146" class="flow" stroke-width="1.5" marker-end="url(#head)"/>

  <!-- 2. Import -->
  <rect x="16" y="150" width="408" height="98" rx="8" class="card" stroke-width="1.5"/>
  <text x="40" y="182" class="t16 title">임포트</text>
  <text x="40" y="208" class="t13 detail">여러 파일과 시트를 하나의 모델로 모으고</text>
  <text x="40" y="230" class="t13 detail">셀을 타입에 맞는 값으로 읽습니다</text>

  <line x1="220" y1="248" x2="220" y2="276" class="flow" stroke-width="1.5" marker-end="url(#head)"/>

  <!-- 3. Validate -->
  <rect x="16" y="280" width="408" height="122" rx="8" class="card" stroke-width="1.5"/>
  <text x="40" y="312" class="t16 title">검증</text>
  <text x="40" y="338" class="t13 detail">타입 · 중복 인덱스 · 참조 무결성</text>
  <text x="40" y="360" class="t13 detail">서버 / 클라이언트 경계</text>
  <text x="40" y="386" class="t12 detail">문제를 한 번에 모아 보고하고, 여기서 멈춥니다</text>

  <line x1="220" y1="402" x2="220" y2="430" class="flow" stroke-width="1.5" marker-end="url(#head)"/>

  <!-- 4. Output. One group rather than two separate arrows: both come out of the same
       run, and which of them a build produces is a line in the recipe. -->
  <rect x="16" y="434" width="408" height="274" rx="8" class="group" stroke-width="1.5"
        stroke-dasharray="5 4"/>
  <text x="40" y="460" class="t11 label">산출물 — RECIPE에 적은 것만, 한 번에</text>

  <rect x="32" y="474" width="376" height="94" rx="6" class="card" stroke-width="1.5"/>
  <text x="52" y="504" class="t16 title">내보내기</text>
  <text x="52" y="528" class="t13 detail">Binary · JSON 파일</text>
  <text x="52" y="550" class="t12 detail">MySQL · PostgreSQL · MongoDB · Redis</text>

  <rect x="32" y="580" width="376" height="112" rx="6" class="card" stroke-width="1.5"/>
  <text x="52" y="608" class="t16 title">코드 생성 — 13개 언어</text>
  <text x="52" y="634" class="t12 detail">C# · TypeScript · C++ · C · Unreal</text>
  <text x="52" y="654" class="t12 detail">Go · Rust · Python · Java · Kotlin</text>
  <text x="52" y="674" class="t12 detail">Ruby · PHP · Dart · 그리고 HTML 문서</text>
</svg>
