<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 208" width="1030" height="208"
     role="img" aria-label="SheetMan 파이프라인: 엑셀과 구글 스프레드시트에서 임포트하고, 검증한 뒤, 내보내기와 코드 생성">
  <title>SheetMan 파이프라인</title>
  <desc>엑셀 또는 구글 스프레드시트 → 데이터 임포트 → 데이터 검증 → 내보내기와 코드 생성</desc>

  <style>
    /*
      Colours that read on a white page, with a dark override. GitHub serves this as an image,
      so the query follows the viewer's system theme rather than the site's toggle - which is
      the closest a single file gets, and better than a diagram that vanishes on one of them.
    */
    .card   { fill: #ffffff; stroke: #c9d1d9; }
    .accent { fill: #f6f8fa; stroke: #c9d1d9; }
    .title  { fill: #1f2328; font-weight: 600; }
    .detail { fill: #656d76; }
    .flow   { stroke: #8c959f; fill: none; }
    .arrow  { fill: #8c959f; }
    .rule   { stroke: #d0d7de; }

    @media (prefers-color-scheme: dark) {
      .card   { fill: #161b22; stroke: #30363d; }
      .accent { fill: #21262d; stroke: #30363d; }
      .title  { fill: #e6edf3; }
      .detail { fill: #9198a1; }
      .flow   { stroke: #6e7681; }
      .arrow  { fill: #6e7681; }
      .rule   { stroke: #30363d; }
    }

    text {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto,
                   "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    }
    .t14 { font-size: 14px; }
    .t12 { font-size: 12px; }
    .t11 { font-size: 11px; }
  </style>

  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow"/>
    </marker>
  </defs>

  <!-- 1. Sources -->
  <rect x="1" y="34" width="196" height="140" rx="8" class="accent" stroke-width="1.5"/>
  <text x="99" y="60" text-anchor="middle" class="t14 title">데이터 원본</text>

  <!-- A spreadsheet glyph, drawn rather than an icon: no logos to keep current. -->
  <g transform="translate(30 78)">
    <rect x="0" y="0" width="48" height="58" rx="4" class="card" stroke-width="1.5"/>
    <line x1="0" y1="15" x2="48" y2="15" class="rule" stroke-width="1"/>
    <line x1="0" y1="30" x2="48" y2="30" class="rule" stroke-width="1"/>
    <line x1="0" y1="44" x2="48" y2="44" class="rule" stroke-width="1"/>
    <line x1="17" y1="15" x2="17" y2="58" class="rule" stroke-width="1"/>
    <line x1="33" y1="15" x2="33" y2="58" class="rule" stroke-width="1"/>
  </g>
  <text x="90" y="102" class="t12 detail">엑셀</text>
  <text x="90" y="124" class="t12 detail">구글 스프레드시트</text>

  <line x1="199" y1="104" x2="235" y2="104" class="flow" stroke-width="1.5" marker-end="url(#head)"/>

  <!-- 2. Import -->
  <rect x="239" y="34" width="176" height="140" rx="8" class="card" stroke-width="1.5"/>
  <text x="327" y="62" text-anchor="middle" class="t14 title">임포트</text>
  <text x="327" y="92"  text-anchor="middle" class="t12 detail">시트에서 엔티티를 찾고</text>
  <text x="327" y="112" text-anchor="middle" class="t12 detail">셀을 값으로 읽습니다</text>
  <text x="327" y="142" text-anchor="middle" class="t11 detail">테이블 · enum · 상수</text>

  <line x1="417" y1="104" x2="453" y2="104" class="flow" stroke-width="1.5" marker-end="url(#head)"/>

  <!-- 3. Validate -->
  <rect x="457" y="34" width="176" height="140" rx="8" class="card" stroke-width="1.5"/>
  <text x="545" y="62" text-anchor="middle" class="t14 title">검증</text>
  <text x="545" y="92"  text-anchor="middle" class="t12 detail">타입 · 중복 인덱스</text>
  <text x="545" y="112" text-anchor="middle" class="t12 detail">참조 · 서버/클라 경계</text>
  <text x="545" y="142" text-anchor="middle" class="t11 detail">문제는 한 번에 모아 보고</text>

  <!-- Forks, because the output is two things rather than one: an arrow to the midpoint
       would point at the gap between them. -->
  <path d="M 635 104 H 653 V 55 H 671" class="flow" stroke-width="1.5" marker-end="url(#head)"/>
  <path d="M 653 104 V 153 H 671" class="flow" stroke-width="1.5" marker-end="url(#head)"/>

  <!-- 4. Output -->
  <rect x="675" y="14" width="354" height="82" rx="8" class="card" stroke-width="1.5"/>
  <text x="699" y="42" class="t14 title">내보내기</text>
  <text x="699" y="66" class="t12 detail">Binary · JSON</text>
  <text x="699" y="84" class="t11 detail">MySQL · PostgreSQL · MongoDB · Redis</text>

  <rect x="675" y="112" width="354" height="82" rx="8" class="card" stroke-width="1.5"/>
  <text x="699" y="140" class="t14 title">코드 생성</text>
  <text x="699" y="164" class="t11 detail">C# · TypeScript · C++ · C · Unreal · Go · Rust</text>
  <text x="699" y="182" class="t11 detail">Python · Java · Kotlin · Ruby · PHP · Dart · HTML 문서</text>
</svg>
